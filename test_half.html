malt, 1 Munchen\nHumle: 50 Magnum -60, 50 Simcoe -15, 50 Cascade -0\nJäst: Safale 05\nPlats: Älta","notes":"Mkt bra"},{"id":1076,"name":"2025 Batch 5","style":"","status":"Klar","date":"2025-08-10","volume":null,"og":1.05,"fg":1.01,"abv":5.24,"ibu":null,"srm":null,"recipe":"Malt: 7 Basmalt, 0,15 rostat korn, 0,2 Carafa, 0,2 Svartmalt, 0,2 Chokladmalt, 700g honung\nHumle: 50 Magnum -60, 30 Mosaic -15, 50 Simcoe -0\nJäst: Safale 05\nPlats: Älta","notes":""},{"id":1077,"name":"2026 Batch 1","style":"","status":"Klar","date":"2026-05-10","volume":null,"og":1.05,"fg":1.012,"abv":4.98,"ibu":null,"srm":null,"recipe":"Malt: 6 Basmalt, 1 Vetemalt\nHumle: 50 Magnum -60, 30 Amarillo -45, 50 Amarillo -0\nJäst: Safale - WB06\nPlats: Älta","notes":""},{"id":1078,"name":"2026 Batch 2","style":"","status":"Klar","date":"2026-05-10","volume":null,"og":1.032,"fg":1.012,"abv":2.62,"ibu":null,"srm":null,"recipe":"Malt: 9,3 bas, 0,15 svart\nHumle: 50 Magnum -60, 80 Amarillo -45, 80 Amarillo -0\nJäst: Safale 05\nPlats: Älta","notes":""}]</script><script>

window.__scriptRan = true;
var __varTest = 'VAR_WORKS';
// ── DATA ─────────────────────────────────────────────────────────────────────
const SEED_BREWS=JSON.parse(document.getElementById("seed-data").textContent);
window.__seedParsed = SEED_BREWS.length;
const SEED_VERSION='3';
const DB={
  get:()=>{
    const s=localStorage.getItem('brews'),v=localStorage.getItem('brews_ver');
    if(!s||JSON.parse(s).length===0||v!==SEED_VERSION){
      localStorage.setItem('brews',JSON.stringify(SEED_BREWS));
      localStorage.setItem('brews_ver',SEED_VERSION);
      return SEED_BREWS;
    }
    return JSON.parse(s);
  },
  set:a=>localStorage.setItem('brews',JSON.stringify(a))
};

// ── COLORS ────────────────────────────────────────────────────────────────────
const SRM=['#FFE699','#FFD878','#FFCA5A','#FFBF42','#FBB123','#F8A600','#F39C00','#EA8F00','#E58500','#DE7C00','#D77200','#CF6900','#CB6200','#C35900','#BB5100','#B54C00','#B04500','#A63E00','#A13700','#9B3200','#952D00','#8E2900','#882300','#821E00','#7B1A00','#771900','#701400','#6A0F00','#660D00','#600900','#5C0800','#560600','#520500','#4C0400','#470300','#420200','#3D0100','#390100','#350100','#300000'];
const srmC=v=>SRM[Math.min(Math.max(Math.round(v)-1,0),39)];
const SCOL={'IPA':'#c8841a','DIPA / TIPA':'#a05010','Stout':'#555','Imperial Stout':'#3a3a3a','Porter':'#7a3a0a','Saison':'#b8a030','Weizen / Hefeweizen':'#c89030','Pale Ale':'#c08840','Lager':'#c0b040','Pilsner':'#c8c848','Sour / Kettle Sour':'#70aa30','Annan':'#607090'};
const sc=s=>SCOL[s]||'#607090';

// ── HELPERS ───────────────────────────────────────────────────────────────────
const by=(arr,fn)=>{const m={};arr.forEach(x=>{const k=fn(x);if(k)m[k]=(m[k]||0)+1});return m};
const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1])[0]||['–',0];
function hopsOf(brews){
  const m={};
  brews.forEach(b=>{
    const r=(b.recipe||'').match(/Humle: (.+)/);
    if(!r)return;
    r[1].split(',').forEach(h=>{
      const n=h.trim().replace(/^\d[\d,.]*\s*/,'').replace(/\s*[-–]\s*\d+.*$/,'').trim();
      if(n&&n.length>1)m[n]=(m[n]||0)+1;
    });
  });
  return m;
}

// ── CHARTS ────────────────────────────────────────────────────────────────────
const CH={};
function mk(id,cfg){if(CH[id])CH[id].destroy();const el=document.getElementById(id);if(el)CH[id]=new Chart(el,cfg);}
const CGRID={color:'#272010'};
const CTICK={color:'#7a6840'};

// ── NAVIGATION ────────────────────────────────────────────────────────────────
function go(name,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  const page=document.getElementById('page-'+name);
  if(page)page.classList.add('active');
  if(btn)btn.classList.add('active');
  window.scrollTo(0,0);
  if(name==='hem')renderHem();
  if(name==='brygder')renderCards();
  if(name==='statistik')renderStat();
}

// ── CARD HTML ─────────────────────────────────────────────────────────────────
function cardHtml(b,num){
  const col=b.srm?srmC(b.srm):sc(b.style);
  const hops=(b.recipe||'').match(/Humle: (.+)/)?.[1]||'';
  const malt=(b.recipe||'').match(/Malt: (.+)/)?.[1]||'';
  return`<div class="brew-card" data-id="${b.id}">
    <div class="card-accent" style="background:${col}"></div>
    <div class="card-body">
      <div class="card-header">
        <div class="card-name">${b.name}</div>
        <span class="card-num">#${num}</span>
      </div>
      <div class="card-badges">
        ${b.style?`<span class="badge b-style">${b.style}</span>`:''}
        ${b.abv?`<span class="badge b-abv">${b.abv}%</span>`:''}
        ${b.date?`<span class="badge b-date">${b.date}</span>`:''}
      </div>
      <div class="card-recipe">
        ${malt?`<strong>Malt:</strong> ${malt}`:''}${malt&&hops?'<br>':''}${hops?`<strong>Humle:</strong> ${hops}`:''}
      </div>
    </div>
  </div>`;
}

// ── HEM ───────────────────────────────────────────────────────────────────────
function renderHem(){
  const all=DB.get();
  const sorted=[...all].sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
  const wa=all.filter(b=>b.abv>0);
  const avg=(wa.reduce((s,b)=>s+b.abv,0)/(wa.length||1)).toFixed(1);
  const maxB=wa.reduce((m,b)=>b.abv>m.abv?b:m,wa[0]||{abv:0,name:'–'});
  const styles=by(all,b=>b.style);
  const hops=hopsOf(all);
  const yrs=by(all.filter(b=>b.date),b=>b.date.slice(0,4));
  const pctIpa=Math.round(((styles['IPA']||0)/(all.length||1))*100);
  const topHopsList=Object.entries(hops).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const validYrs=Object.entries(yrs).filter(([y])=>y>='2019').sort((a,b)=>a[0].localeCompare(b[0]));
  const bestYear=validYrs.reduce((m,e)=>e[1]>m[1]?e:m,['–',0]);

  document.getElementById('stats-inner').innerHTML=[
    {n:all.length,l:'Brygder totalt',d:'sedan 2019'},
    {n:avg+'%',l:'Snitt ABV',d:'per brygd'},
    {n:topHopsList[0]?.[0]||'–',l:'Favorithumle #1',d:(topHopsList[0]?.[1]||0)+' brygder'},
    {n:topHopsList[1]?.[0]||'–',l:'Favorithumle #2',d:(topHopsList[1]?.[1]||0)+' brygder'},
    {n:topHopsList[2]?.[0]||'–',l:'Favorithumle #3',d:(topHopsList[2]?.[1]||0)+' brygder'},
    {n:bestYear[0],l:'Rekordår',d:bestYear[1]+' brygder'},
    ...validYrs.map(([y,c])=>({n:c,l:'Brygder '+y,d:y})),
    {n:pctIpa+'%',l:'Är IPA',d:(styles['IPA']||0)+' av '+all.length},
    {n:maxB.abv+'%',l:'Starkaste',d:maxB.name},
  ].map(f=>`<div class="stat"><div class="stat-num">${f.n}</div><div class="stat-label">${f.l}</div><div class="stat-detail">${f.d}</div></div>`).join('');

  document.getElementById('split-facts').innerHTML=[
    {n:all.length,l:'Brygder'},{n:topHopsList[0]?.[0]||'–',l:'Favorithumle'},{n:bestYear[0]+' ('+bestYear[1]+'st)',l:'Rekordår'},
  ].map(f=>`<div class="fact"><div class="n">${f.n}</div><div class="l">${f.l}</div></div>`).join('');

  document.getElementById('home-meta').textContent='Visar 10 av '+all.length;
  document.getElementById('home-grid').innerHTML=sorted.slice(0,10).map((b,i)=>cardHtml(b,all.length-i)).join('')||
    `<div class="empty"><div class="ico">🍺</div><p>Inga brygder ännu.</p></div>`;

  const sl=Object.entries(styles).sort((a,b)=>b[1]-a[1]).slice(0,7);
  mk('ch-styles-home',{type:'doughnut',data:{labels:sl.map(e=>e[0]),datasets:[{data:sl.map(e=>e[1]),backgroundColor:sl.map(e=>sc(e[0])),borderColor:'#0f0d08',borderWidth:2}]},options:{plugins:{legend:{position:'right',labels:{color:'#7a6840',boxWidth:11,font:{size:10}}}}}});

  const th=Object.entries(hops).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const mh=th[0]?.[1]||1;
  document.getElementById('hops-home').innerHTML=th.map(([n,c],i)=>`
    <li><span class="tl-rank">${i+1}</span>
    <div class="tl-body"><div class="tl-row"><span class="tl-name">${n}</span><span class="tl-cnt">${c} brygder</span></div>
    <div class="tl-bar"><div class="tl-fill" style="width:${Math.round(c/mh*100)}%"></div></div></div></li>`).join('');

  const vy=Object.keys(yrs).filter(y=>y>='2019').sort();
  mk('ch-years-home',{type:'bar',data:{labels:vy,datasets:[{data:vy.map(y=>yrs[y]||0),backgroundColor:'#a06018',borderRadius:4}]},options:{plugins:{legend:{display:false}},scales:{x:{ticks:CTICK,grid:CGRID},y:{ticks:{...CTICK,stepSize:1},grid:CGRID}}}});
}

// ── BRYGDER ───────────────────────────────────────────────────────────────────
function renderCards(){
  let all=DB.get();
  const q=(document.getElementById('q').value||'').toLowerCase();
  const so=document.getElementById('sort').value;
  const chips=document.getElementById('style-chips');
  if(!chips.dataset.ok){
    const ss=[...new Set(all.map(b=>b.style).filter(Boolean))].sort();
    chips.innerHTML=`<button class="chip on" data-s="">Alla</button>`+ss.map(s=>`<button class="chip" data-s="${s}">${s}</button>`).join('');
    chips.dataset.ok='1';
  }
  const ac=chips.querySelector('.chip.on');
  const sf=ac?ac.dataset.s:'';
  if(sf)all=all.filter(b=>b.style===sf);
  if(q)all=all.filter(b=>(b.name+' '+(b.recipe||'')+' '+(b.style||'')).toLowerCase().includes(q));

    if(so==='abv-hi')return(b.abv||0)-(a.abv||0);
    if(so==='abv-lo')return(a.abv||0)-(b.abv||0);
    return a.name.localeCompare(b.name,'sv');
  });

  const grid=document.getElementById('brygder-grid'),empty=document.getElementById('brygder-empty');

  empty.style.display='none';
  grid.innerHTML=all.map((b,i)=>cardHtml(b,total-i)).join('');
}
